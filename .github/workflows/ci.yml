name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - fix/token-budget-underflow

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Run locked test suite
        run: cargo test --locked
